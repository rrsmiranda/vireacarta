<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Vire a Carta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Manrope:wght@400;500;700;800&display=swap">
<style>
/* Layout: arena de palco único — HUD no topo, carta protagonista no centro, ações no rodapé. Visual escuro fixo (mundo de game). */
:root{
  --bg:#111426; --bg2:#0A0C1A; --surface:#1D2240; --surface2:#262C52;
  --violet:#735CFF; --cyan:#34D5F3; --gold:#FFC66D; --gold2:#F2A33A;
  --fg:#F7F8FF; --muted:#BFC6E0; --ok:#40D6A4; --warn:#FFBD69; --err:#FF6978;
  --card:#F4F2FB; --card-ink:#1B1E36;
  --f-display:"Lilita One","Arial Black",Impact,system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:20px; --t-flip:600ms; --t-fast:180ms;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden}
.arena{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(60% 45% at 50% 38%,color-mix(in srgb,var(--violet) 45%,transparent),transparent 70%),
   radial-gradient(40% 40% at 8% 20%,color-mix(in srgb,var(--cyan) 22%,transparent),transparent 70%),
   radial-gradient(40% 40% at 92% 20%,color-mix(in srgb,var(--violet) 30%,transparent),transparent 70%),
   linear-gradient(180deg,var(--bg2),var(--bg) 55%,var(--bg2))}
.arena::after{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:42%;
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--cyan) 18%,transparent) 0 1px,transparent 1px 60px),
   repeating-linear-gradient(0deg,color-mix(in srgb,var(--cyan) 14%,transparent) 0 1px,transparent 1px 40px);
  transform:perspective(500px) rotateX(62deg);transform-origin:bottom;mask-image:linear-gradient(to top,#000,transparent)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:16px 24px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--cyan)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:12px}

/* Faixa de status */
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.4;
  background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 55%,transparent);color:var(--fg)}
.banner b{color:var(--warn)}
.banner.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface));border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.banner.ok b{color:var(--ok)}

/* Logo */
.logo{text-align:center;line-height:.86;font-family:var(--f-display);letter-spacing:.01em;filter:drop-shadow(0 6px 0 #0006)}
.logo .l1{display:block;font-size:clamp(40px,12vw,60px);color:var(--fg);
  text-shadow:0 0 18px color-mix(in srgb,var(--cyan) 70%,transparent),0 3px 0 #3C3A8A}
.logo .l2{display:block;font-size:clamp(66px,21vw,104px);
  background:linear-gradient(180deg,#FFF1C9 0%,var(--gold) 45%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #5A3A0E}
.ribbon{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:.02em;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--cyan) 50%,transparent)}

/* Duelo */
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:4px}
.vs{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--gold);
  text-shadow:0 0 22px color-mix(in srgb,var(--gold) 80%,transparent),0 4px 0 #6B3F0B;transform:rotate(-6deg)}
.avatar{display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity var(--t-fast),transform var(--t-fast)}
.avatar .frame{width:min(34vw,150px);aspect-ratio:1;border-radius:28px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 2px color-mix(in srgb,var(--violet) 70%,transparent),0 0 30px color-mix(in srgb,var(--violet) 40%,transparent)}
.avatar .frame img,.avatar .frame svg{width:100%;height:100%;object-fit:cover;display:block}
.avatar .name{font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.idle .frame{animation:breathe 3.6s ease-in-out infinite}
.idle:nth-child(3) .frame{animation-delay:-1.8s}
@keyframes breathe{50%{transform:translateY(-4px) scale(1.015)}}

/* Botões */
.btn-main{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:0 20px;
  font-family:var(--f-display);font-size:24px;letter-spacing:.03em;color:#2A1A02;
  background:linear-gradient(180deg,#FFE3A1,var(--gold) 50%,var(--gold2));
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);
  transition:transform var(--t-fast),filter var(--t-fast)}
.btn-main:hover{filter:brightness(1.07)} .btn-main:active{transform:scale(.98)}
.btn-main:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.btn-ghost{min-height:48px;padding:0 16px;border-radius:14px;font-weight:700;font-size:15px;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--muted) 30%,transparent)}
.btn-ghost:hover{border-color:var(--cyan)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--muted);
  border:1px solid color-mix(in srgb,var(--muted) 25%,transparent)}
.chip b{color:var(--fg)}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:0}

/* Escolha de candidato: estilos idênticos para os dois */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 12px;border-radius:22px;
  background:linear-gradient(180deg,var(--surface2),var(--surface));
  border:2px solid color-mix(in srgb,var(--violet) 55%,transparent);transition:transform var(--t-fast),border-color var(--t-fast),opacity var(--t-fast)}
.pick button .frame{width:min(28vw,110px);aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--surface)}
.pick button .frame svg,.pick button .frame img{width:100%;height:100%;object-fit:cover;display:block}
.pick button .name{font-family:var(--f-display);font-size:22px}
.pick button[aria-pressed="true"]{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 0 26px color-mix(in srgb,var(--gold) 45%,transparent)}
.pick.has-choice button[aria-pressed="false"]{opacity:.55}

/* HUD */
.hud{display:flex;align-items:center;gap:12px}
.hud .back{width:44px;height:44px;border-radius:12px;background:var(--surface);font-size:20px}
.hud .prog{flex:1;display:flex;flex-direction:column;gap:6px}
.hud .prog small{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .4s}
.score{font-family:var(--f-display);font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.score small{display:block;font-family:var(--f-body);font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted)}

/* Carta 3D */
.stage{perspective:1400px;display:flex;justify-content:center}
.card3d{position:relative;width:min(100%,380px);aspect-ratio:5/6.4;transform-style:preserve-3d;transition:transform var(--t-flip) cubic-bezier(.2,.75,.25,1)}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.front{background:linear-gradient(170deg,#FFFFFF,var(--card));color:var(--card-ink);
  box-shadow:0 0 0 3px var(--gold),0 0 0 6px #6B3F0B,0 0 40px color-mix(in srgb,var(--gold) 55%,transparent),0 24px 40px #0008}
.front::before{content:"";position:absolute;inset:10px;border:1.5px solid color-mix(in srgb,var(--violet) 30%,transparent);border-radius:16px;pointer-events:none}
.back{transform:rotateY(180deg);background:linear-gradient(170deg,var(--surface2),var(--surface));
  box-shadow:0 0 0 3px var(--cyan),0 0 40px color-mix(in srgb,var(--cyan) 45%,transparent),0 24px 40px #0008;align-items:center;text-align:center;justify-content:center}
.tag-num{align-self:center;font-family:var(--f-display);font-size:18px;letter-spacing:.06em;padding:4px 18px;border-radius:8px;
  background:linear-gradient(180deg,#FFE3A1,var(--gold));color:#3A2405}
.tag-cat{align-self:center;font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--violet);color:#fff}
.suit{position:absolute;font-size:22px;color:color-mix(in srgb,var(--violet) 70%,var(--card-ink))}
.suit.tl{top:16px;left:18px} .suit.br{bottom:16px;right:18px;transform:rotate(180deg)}
.prop{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;
  font-size:clamp(19px,5.4vw,24px);line-height:1.32;text-wrap:balance;margin:0}
.prop.long{font-size:clamp(16px,4.4vw,19px)}
.back .who{font-family:var(--f-display);font-size:34px;line-height:1.05}
.back .frame{width:44%;aspect-ratio:1;border-radius:24px;overflow:hidden;box-shadow:0 0 0 2px var(--cyan)}
.back .frame svg,.back .frame img{width:100%;height:100%;object-fit:cover;display:block}
.verdict{font-family:var(--f-display);font-size:26px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--warn)}
.status-pill{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent)}
.status-pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.plus{position:absolute;top:18%;font-family:var(--f-display);font-size:44px;color:var(--gold);animation:pop 1.1s ease-out forwards;pointer-events:none}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.6)}25%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-40px)}}

/* Painéis */
.panel{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;
  border:1px solid color-mix(in srgb,var(--muted) 18%,transparent)}
.panel h2,.panel h3{margin:0;font-family:var(--f-display);font-weight:400;letter-spacing:.02em}
.panel h2{font-size:28px} .panel h3{font-size:20px}
.panel p{margin:0;color:var(--muted)}
.q{font-family:var(--f-display);font-size:24px;text-align:center;margin:0;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{min-height:52px;border-radius:16px;font-weight:800;font-size:16px;background:var(--surface);
  border:2px solid color-mix(in srgb,var(--muted) 25%,transparent);transition:border-color var(--t-fast)}
.opt[aria-pressed="true"]{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,var(--surface))}
dl.ev{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.ev dt{color:var(--muted);font-weight:700}
dl.ev dd{margin:0;min-width:0;overflow-wrap:anywhere}
.modes{display:grid;gap:12px}
.mode{text-align:left;padding:16px 18px;border-radius:18px;background:linear-gradient(180deg,var(--surface2),var(--surface));
  border:2px solid color-mix(in srgb,var(--violet) 45%,transparent);display:flex;flex-direction:column;gap:2px}
.mode:hover{border-color:var(--cyan)}
.mode strong{font-family:var(--f-display);font-weight:400;font-size:22px}
.mode span{color:var(--muted);font-size:14px}
.mode:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid color-mix(in srgb,var(--muted) 35%,transparent);border-radius:12px;min-height:44px;padding:0 12px;width:100%}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--fg);background:var(--bg);border:1px solid color-mix(in srgb,var(--muted) 35%,transparent);border-radius:12px;padding:10px;width:100%;min-height:140px;resize:vertical;box-sizing:border-box}
.lib{display:grid;gap:10px}
.lib-item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid color-mix(in srgb,var(--muted) 18%,transparent)}
.lib-item .n{font-family:var(--f-display);font-size:20px;color:var(--gold);grid-row:span 2}
.lib-item .t{font-weight:700;min-width:0}
.lib-item .m{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums}
.msg{font-size:14px;color:var(--muted)}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
.toolbar{display:flex;justify-content:flex-end;gap:8px}
.icon-btn{min-height:40px;padding:0 12px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:700;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.reduce *,.reduce *::before,.reduce *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:1ms!important}}
@media (min-width:900px){.app{max-width:620px}}
</style>

<div class="arena" aria-hidden="true"></div>
<main class="app" id="app" aria-live="polite"></main>
<div class="sr" id="live" aria-live="assertive"></div>

<script>
(() => {
"use strict";

/* ===== Dados de partida =====
   Única carta transcrita no briefing (seção 5). As outras 31 entram ao importar
   vire_a_carta_dataset_inicial.json na tela "Dados". Nada é inventado. */
const SEED_CARDS = [{
  id: 3,
  texto_original_pdf: "Adotar jornada de trabalho com duas folgas por semana, sem redução de salário.",
  categoria_original_pdf: "direitos trabalhistas",
  candidato_atribuido_no_pdf: "Lula",
  url_qr_original: "https://tr.ee/RuBjxDsa20u6",
  status_verificacao: "pendente",
  publicavel: false
}];

const CANDIDATES = [
  { id: "lula", name: "Lula", initial: "L" },
  { id: "flavio", name: "Flávio Bolsonaro", short: "Flávio", initial: "F" }
];
const SUITS = ["♠", "♥", "♦", "♣"];
const STORE_KEY = "vire-a-carta:v1";

/* ===== Estado ===== */
let store = load();
let cards = store.cards || SEED_CARDS;
let avatars = store.avatars || {};
let reduce = !!store.reduce;
let S = { view: "landing" };

function load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify({ cards, avatars, reduce })); } catch {} }

/* ===== Utilidades ===== */
const $app = document.getElementById("app");
const $live = document.getElementById("live");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const say = t => { $live.textContent = ""; setTimeout(() => $live.textContent = t, 30); };
const safeUrl = u => { try { const x = new URL(u); return x.protocol === "https:" ? x.href : null; } catch { return null; } };
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const candOf = name => { const n = norm(name); if (n.includes("lula")) return "lula"; if (n.includes("flavio")) return "flavio"; return null; };
const isVerified = c => c.publicavel === true && c.status_verificacao === "verificada";

function mulberry(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* Conjunto jogável: se houver cartas verificadas, só elas (modo oficial). Senão, demonstração rotulada. */
function pool(){
  const ver = cards.filter(isVerified);
  return ver.length ? { list: ver, official: true } : { list: cards, official: false };
}
function categories(){ return [...new Set(pool().list.map(c => c.categoria_original_pdf).filter(Boolean))].sort(); }

function buildDeck(mode, cat){
  const seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  const rnd = mulberry(seed);
  let list = pool().list;
  if (mode === "tema") list = list.filter(c => c.categoria_original_pdf === cat);
  if (mode === "rapido") {
    const L = shuffle(list.filter(c => candOf(c.candidato_atribuido_no_pdf) === "lula"), rnd);
    const F = shuffle(list.filter(c => candOf(c.candidato_atribuido_no_pdf) === "flavio"), rnd);
    if (L.length >= 5 && F.length >= 5) return { seed, deck: shuffle([...L.slice(0,5), ...F.slice(0,5)], rnd) };
    return { seed, deck: shuffle(list, rnd).slice(0, 10) };
  }
  return { seed, deck: shuffle(list, rnd) };
}

/* ===== Avatares: placeholder simétrico (mesma arte, mesma cor), substituível por arte licenciada ===== */
function avatarSVG(c){
  if (avatars[c.id]) return `<img src="${esc(avatars[c.id])}" alt="">`;
  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    <defs><linearGradient id="g${c.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3F78"/><stop offset="1" stop-color="#1D2240"/></linearGradient></defs>
    <rect width="120" height="120" fill="url(#g${c.id})"/>
    <circle cx="60" cy="46" r="22" fill="#8C93C9"/>
    <path d="M18 120c4-28 22-40 42-40s38 12 42 40z" fill="#8C93C9"/>
    <path d="M48 82l12 14 12-14" fill="none" stroke="#F7F8FF" stroke-width="3"/>
    <circle cx="94" cy="24" r="16" fill="#FFC66D"/>
    <text x="94" y="30" text-anchor="middle" font-family="Lilita One,Arial Black,sans-serif" font-size="18" fill="#3A2405">${c.initial}</text>
  </svg>`;
}

/* ===== Views ===== */
function render(){
  document.documentElement.classList.toggle("reduce", reduce);
  const v = { landing, modes, round, results, library, data, about }[S.view] || landing;
  $app.innerHTML = v();
  bind();
  const h = $app.querySelector("[data-focus]"); if (h) h.focus({ preventScroll: true });
}

function statusBanner(){
  const p = pool();
  if (p.official) return `<div class="banner ok" role="status"><span>✓</span><span><b>${p.list.length} cartas verificadas.</b> Atribuições revisadas pela equipe editorial.</span></div>`;
  return `<div class="banner" role="status"><span>⚠</span><span><b>Acervo em revisão.</b> Nenhuma carta foi verificada ainda. Este é um <b>modo demonstração</b>: as respostas mostram apenas o que o material de origem atribui, sem confirmação.</span></div>`;
}

function toolbar(){
  return `<div class="toolbar">
    <button class="icon-btn" data-act="motion" aria-pressed="${reduce}">${reduce ? "Animações: off" : "Animações: on"}</button>
    <button class="icon-btn" data-go="data">Dados</button>
  </div>`;
}

function landing(){
  const p = pool();
  return `${toolbar()}
  <header class="logo" aria-label="Vire a Carta — O Jogo das Propostas">
    <span class="l1">VIRE A</span><span class="l2">CARTA</span>
    <span class="ribbon">O Jogo das Propostas</span>
  </header>
  <section class="duel" aria-label="Os dois candidatos do baralho">
    <div class="avatar idle"><div class="frame">${avatarSVG(CANDIDATES[0])}</div><span class="name">Lula</span></div>
    <div class="vs" aria-hidden="true">VS</div>
    <div class="avatar idle"><div class="frame">${avatarSVG(CANDIDATES[1])}</div><span class="name">Flávio</span></div>
  </section>
  <p class="q">Você sabe quem defende cada proposta?</p>
  <p class="hint">Leia a proposta. O autor só aparece depois.</p>
  <button class="btn-main" data-go="modes" data-focus>COMEÇAR A JOGAR ›</button>
  <div class="chips">
    <span class="chip"><b>${cards.length}</b> ${cards.length === 1 ? "carta importada" : "cartas importadas"}</span>
    <span class="chip"><b>${cards.filter(isVerified).length}</b> verificadas</span>
    <span class="chip">${p.official ? "Modo oficial" : "Demonstração"}</span>
  </div>
  ${statusBanner()}
  <div class="row">
    <button class="btn-ghost" data-go="about">Como jogar</button>
    <button class="btn-ghost" data-go="library">Explorar cartas</button>
  </div>`;
}

function modes(){
  const p = pool(); const n = p.list.length; const cats = categories();
  return `${hud(null)}
  <div class="panel"><h2>Escolha o modo</h2><p>${p.official ? `${n} cartas verificadas disponíveis.` : `Demonstração com ${n} ${n===1?"carta":"cartas"} não verificadas.`}</p></div>
  <div class="modes">
    <button class="mode" data-mode="rapido" data-focus><strong>Desafio rápido</strong><span>Até 10 cartas, sem repetição${n < 10 ? ` · só ${n} disponíveis agora` : ""}</span></button>
    <button class="mode" data-mode="completo"><strong>Baralho completo</strong><span>Todas as ${n} cartas</span></button>
    <div class="mode" style="cursor:default"><strong>Por tema</strong>
      <label for="tema" class="sr">Tema</label>
      <div class="row" style="margin-top:8px"><select id="tema">${cats.map(c => `<option>${esc(c)}</option>`).join("")}</select>
      <button class="btn-ghost" data-mode="tema" ${cats.length ? "" : "disabled"}>Jogar tema</button></div>
    </div>
  </div>
  ${statusBanner()}`;
}

function hud(r){
  if (!r) return `<div class="hud"><button class="back" data-go="landing" aria-label="Voltar ao início">‹</button><div class="prog"><small>Vire a Carta</small><div class="bar"><i style="width:0"></i></div></div></div>`;
  const total = S.deck.length, i = S.i + 1;
  return `<div class="hud">
    <button class="back" data-act="quit" aria-label="Sair da partida">✕</button>
    <div class="prog"><small>Carta ${i} de ${total}${S.official ? "" : " · demonstração"}</small><div class="bar"><i style="width:${(S.i/total)*100}%"></i></div></div>
    <div class="score" aria-label="${S.official ? "Pontos" : "Acertos de treino"}">${S.official ? S.score : S.hits}<small>${S.official ? "PONTOS" : "TREINO"}</small></div>
  </div>`;
}

function cardFace(c){
  const long = (c.texto_original_pdf || "").length > 140;
  const s = SUITS[c.id % 4];
  return `<div class="face front">
    <span class="suit tl" aria-hidden="true">${s}</span><span class="suit br" aria-hidden="true">${s}</span>
    <span class="tag-num">CARTA ${pad(c.id)}</span>
    ${c.categoria_original_pdf ? `<span class="tag-cat">#${esc(c.categoria_original_pdf.replace(/\s+/g,""))}</span>` : ""}
    <p class="prop${long ? " long" : ""}">${esc(c.texto_original_pdf)}</p>
  </div>`;
}

function round(){
  const c = S.deck[S.i];
  const step = S.step; // read | opinion | guess | reveal
  const truth = candOf(c.candidato_atribuido_no_pdf);
  const truthC = CANDIDATES.find(x => x.id === truth);
  const verified = isVerified(c);
  let back = `<div class="face back"></div>`;
  if (step === "reveal") {
    const right = S.guess && S.guess === truth;
    back = `<div class="face back">
      <span class="status-pill${verified ? " ok" : ""}">${verified ? "Atribuição verificada" : "Não verificado · material de origem"}</span>
      <div class="frame">${truthC ? avatarSVG(truthC) : ""}</div>
      <div class="who">${truthC ? esc(truthC.name) : "Sem atribuição"}</div>
      <div class="verdict ${right ? "ok" : "no"}">${S.guess === "skip" ? "Você pulou." : right ? "Você acertou!" : "Desta vez, não foi."}</div>
      ${right && S.official ? `<span class="plus" aria-hidden="true">+10</span>` : ""}
    </div>`;
  }
  let below = "";
  if (step === "read") below = `<p class="hint">Leia a proposta. O autor só aparece depois.</p>
    <button class="btn-main" data-act="toOpinion" data-focus>CONTINUAR ›</button>`;
  if (step === "opinion") below = `<div class="panel"><p class="q">O que você pensa sobre esta ideia?</p>
    <div class="opts">
      ${[["agree","Concordo"],["disagree","Discordo"],["unsure","Não tenho opinião / quero entender melhor"]].map(([k,l]) =>
        `<button class="opt" data-op="${k}" aria-pressed="${S.opinion===k}">${l}</button>`).join("")}
    </div><p class="msg">Opcional. Sua opinião fica só neste aparelho, durante a rodada, e não vale pontos.</p></div>
    <button class="btn-main" data-act="toGuess" data-focus>${S.opinion ? "CONTINUAR ›" : "PULAR ›"}</button>`;
  if (step === "guess") below = `<p class="q">Quem está associado a esta proposta?</p>
    <div class="pick${S.guess ? " has-choice" : ""}" role="group" aria-label="Escolha um candidato">
      ${CANDIDATES.map(x => `<button data-guess="${x.id}" aria-pressed="${S.guess===x.id}"><span class="frame">${avatarSVG(x)}</span><span class="name">${esc(x.short||x.name)}</span></button>`).join("")}
    </div>
    <button class="btn-main" data-act="flip" ${S.guess ? "" : "disabled"} data-focus>VIRAR A CARTA ⟲</button>
    <button class="btn-ghost" data-act="skip">Pular esta carta</button>`;
  if (step === "reveal") {
    const url = safeUrl(c.url_qr_original);
    below = `<div class="panel" id="ev"><h3>Evidência</h3>
      <dl class="ev">
        <dt>A carta diz</dt><dd>${esc(c.texto_original_pdf)}</dd>
        <dt>Atribuído a</dt><dd>${esc(c.candidato_atribuido_no_pdf || "—")} <span class="msg">(segundo o material de origem)</span></dd>
        <dt>Status</dt><dd><span class="status-pill${verified ? " ok" : ""}">${esc(c.status_verificacao || "pendente")}</span></dd>
        <dt>Link do QR</dt><dd>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>` : "Link ausente ou inválido"}</dd>
        <dt>Destino</dt><dd>${c.fonte_url_destino && safeUrl(c.fonte_url_destino) ? `<a href="${esc(safeUrl(c.fonte_url_destino))}" target="_blank" rel="noopener noreferrer">${esc(c.fonte_titulo || c.fonte_url_destino)}</a>` : "Ainda não verificado. O link curto pode redirecionar para qualquer página."}</dd>
        ${c.explicacao_didatica ? `<dt>Entenda</dt><dd>${esc(c.explicacao_didatica)}</dd>` : ""}
      </dl></div>
    <div class="row">
      ${url ? `<a class="btn-ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Ver evidência ↗</a>` : ""}
      <button class="btn-main" data-act="next" data-focus style="flex-basis:100%">${S.i + 1 < S.deck.length ? "PRÓXIMA CARTA ›" : "VER RESULTADO ›"}</button>
    </div>`;
  }
  return `${hud(true)}
    ${S.official ? "" : `<div class="banner" role="note"><span>⚠</span><span><b>Demonstração:</b> conteúdo não verificado.</span></div>`}
    <div class="stage"><div class="card3d${step === "reveal" ? " flipped" : ""}" id="card">${cardFace(c)}${back}</div></div>
    ${below}`;
}

function results(){
  const n = S.deck.length, pct = n ? Math.round(S.hits / n * 100) : 0;
  const themes = [...new Set(S.deck.map(c => c.categoria_original_pdf).filter(Boolean))];
  return `${hud(null)}
  <div class="panel" style="text-align:center;align-items:center">
    <h2>Fim da partida</h2>
    <div class="big">${S.official ? S.score : S.hits}</div>
    <p>${S.official ? "pontos" : "acertos de treino"} · ${S.hits} de ${n} cartas · ${pct}%</p>
    <p>${S.official ? "Cada acerto em carta verificada vale 10 pontos, para qualquer candidato." : "Na demonstração não há pontos oficiais: as respostas ainda não foram verificadas."}</p>
  </div>
  ${themes.length ? `<div class="panel"><h3>Temas explorados</h3><div class="chips" style="justify-content:flex-start">${themes.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>` : ""}
  <button class="btn-main" data-go="modes" data-focus>JOGAR NOVAMENTE ›</button>
  <div class="row"><button class="btn-ghost" data-go="library">Explorar evidências</button><button class="btn-ghost" data-act="share">Copiar resultado</button></div>
  <p class="msg" id="sharemsg"></p>`;
}

function library(){
  const list = cards.slice().sort((a,b) => a.id - b.id);
  return `${hud(null)}
  <div class="panel"><h2>Cartas</h2><p>${pool().official ? "Mostrando cartas verificadas e, abaixo, as em revisão." : "Todas as cartas estão em revisão. Autoria exibida apenas como atribuição do material de origem."}</p>
  <label for="q" class="sr">Buscar</label><input type="text" id="q" placeholder="Buscar por texto ou tema"></div>
  <div class="lib" id="lib">${list.map(c => `<div class="lib-item" data-text="${esc(norm(c.texto_original_pdf + " " + c.categoria_original_pdf))}">
    <span class="n">${pad(c.id)}</span><span class="t">${esc(c.texto_original_pdf)}</span>
    <span class="m"><span>${esc(c.categoria_original_pdf || "sem tema")}</span><span class="status-pill${isVerified(c) ? " ok" : ""}">${isVerified(c) ? "verificada" : esc(c.status_verificacao || "pendente")}</span>
    ${safeUrl(c.url_qr_original) ? `<a href="${esc(safeUrl(c.url_qr_original))}" target="_blank" rel="noopener noreferrer">link do QR ↗</a>` : ""}</span></div>`).join("")}</div>`;
}

function data(){
  return `${hud(null)}
  <div class="panel"><h2>Dados do baralho</h2>
    <p>Importe o <b>vire_a_carta_dataset_inicial.json</b> para carregar as 32 cartas. O arquivo fica salvo só neste navegador.</p>
    <label class="btn-ghost" style="display:flex;align-items:center;justify-content:center" for="file">Escolher arquivo JSON</label>
    <input type="file" id="file" accept="application/json,.json" class="sr">
    <label for="paste" class="msg">Ou cole o conteúdo do JSON:</label>
    <textarea id="paste" placeholder='[{"id":1,"texto_original_pdf":"…","categoria_original_pdf":"…","candidato_atribuido_no_pdf":"…","url_qr_original":"https://tr.ee/…"}]'></textarea>
    <button class="btn-main" data-act="importPaste">IMPORTAR</button>
    <p class="msg" id="impmsg">Carregadas agora: ${cards.length} ${cards.length===1?"carta":"cartas"}.</p>
    <button class="btn-ghost" data-act="reset">Voltar à carta de exemplo</button>
  </div>
  <div class="panel"><h3>Arte dos personagens</h3>
    <p>Envie ilustrações licenciadas (PNG/WebP quadrado). Use o mesmo estilo e enquadramento para os dois.</p>
    ${CANDIDATES.map(c => `<div class="row" style="align-items:center"><span style="flex:0 0 auto;width:56px;height:56px;border-radius:14px;overflow:hidden">${avatarSVG(c)}</span>
      <label class="btn-ghost" for="av-${c.id}" style="display:flex;align-items:center;justify-content:center">Imagem de ${esc(c.short||c.name)}</label>
      <input type="file" id="av-${c.id}" data-av="${c.id}" accept="image/png,image/webp,image/jpeg" class="sr"></div>`).join("")}
    <button class="btn-ghost" data-act="clearAv">Remover imagens</button>
  </div>`;
}

function about(){
  return `${hud(null)}
  <div class="panel"><h2>Como jogar</h2>
    <p><b>1. Leia</b> a proposta na carta. O autor fica escondido.</p>
    <p><b>2. Opine</b> se quiser. Sua opinião não vale pontos e não sai do aparelho.</p>
    <p><b>3. Palpite</b> quem está associado à proposta.</p>
    <p><b>4. Vire a carta</b> e confira a evidência pelo link do QR Code.</p>
  </div>
  <div class="panel"><h3>Sobre as fontes</h3>
    <p>As cartas vêm do material “Baralho 2026”. Textos e autores são <b>atribuições do material</b>, não fatos confirmados. Cada carta só vira “verificada” depois que a equipe editorial abre o link, confere a fonte primária e aprova a publicação.</p>
    <p>Pontuação simétrica: +10 por acerto em carta verificada, para qualquer candidato. Não há medidor de afinidade nem recomendação de voto.</p>
    <p>Avatares são ilustrações genéricas de exemplo e não representam endosso dos retratados.</p>
  </div>`;
}

/* ===== Eventos ===== */
function bind(){
  $app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.view = b.dataset.go; render(); });
  $app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => start(b.dataset.mode));
  $app.querySelectorAll("[data-op]").forEach(b => b.onclick = () => { S.opinion = S.opinion === b.dataset.op ? null : b.dataset.op; render(); });
  $app.querySelectorAll("[data-guess]").forEach(b => b.onclick = () => { if (S.step !== "guess") return; S.guess = b.dataset.guess; render(); });
  $app.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(b.dataset.act));
  const q = document.getElementById("q");
  if (q) q.oninput = () => { const t = norm(q.value); document.querySelectorAll(".lib-item").forEach(el => el.hidden = !el.dataset.text.includes(t)); };
  const f = document.getElementById("file");
  if (f) f.onchange = () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => importJSON(r.result); r.readAsText(file); };
  $app.querySelectorAll("[data-av]").forEach(inp => inp.onchange = () => {
    const file = inp.files[0]; if (!file || file.size > 1.5e6) { if (file) alertMsg("Imagem acima de 1,5 MB. Comprima e tente de novo.", true); return; }
    const r = new FileReader(); r.onload = () => { avatars[inp.dataset.av] = r.result; save(); render(); }; r.readAsDataURL(file);
  });
}

function start(mode){
  const cat = mode === "tema" ? document.getElementById("tema")?.value : null;
  const { seed, deck } = buildDeck(mode, cat);
  if (!deck.length) return;
  S = { view: "round", deck, seed, i: 0, step: "read", score: 0, hits: 0, guess: null, opinion: null, locked: false, official: pool().official };
  render();
}

function act(a){
  if (a === "motion") { reduce = !reduce; save(); render(); return; }
  if (a === "quit") { S = { view: "landing" }; render(); return; }
  if (a === "toOpinion") { S.step = "opinion"; render(); return; }
  if (a === "toGuess") { S.step = "guess"; render(); return; }
  if (a === "skip") { S.guess = "skip"; reveal(); return; }
  if (a === "flip") { if (S.guess) reveal(); return; }
  if (a === "next") {
    S.i++; S.opinion = null; S.guess = null; S.locked = false;
    if (S.i >= S.deck.length) { S.view = "results"; } else { S.step = "read"; }
    render(); return;
  }
  if (a === "share") {
    const n = S.deck.length;
    const txt = `Joguei Vire a Carta: acertei ${S.hits} de ${n} cartas. Você sabe quem defende cada proposta?`;
    const m = document.getElementById("sharemsg");
    navigator.clipboard?.writeText(txt).then(() => m.textContent = "Resultado copiado.", () => m.textContent = txt);
    if (!navigator.clipboard) m.textContent = txt;
    return;
  }
  if (a === "importPaste") { importJSON(document.getElementById("paste").value); return; }
  if (a === "reset") { cards = SEED_CARDS; save(); render(); alertMsg("Baralho voltou à carta de exemplo."); return; }
  if (a === "clearAv") { avatars = {}; save(); render(); return; }
}

/* Palpite travado: a pontuação é calculada uma única vez por rodada. */
function reveal(){
  if (S.locked) return;
  S.locked = true;
  const c = S.deck[S.i];
  const truth = candOf(c.candidato_atribuido_no_pdf);
  const right = S.guess !== "skip" && S.guess === truth;
  if (right) S.hits++;
  if (right && isVerified(c)) S.score += 10;   // simétrico: 10 para qualquer candidato
  S.step = "reveal";
  render();
  say(S.guess === "skip" ? "Carta pulada." : right ? "Você acertou!" : "Desta vez, não foi.");
}

/* ===== Importação com validação ===== */
function importJSON(raw){
  let d;
  try { d = JSON.parse(raw); } catch { return alertMsg("O texto não é um JSON válido. Confira vírgulas e aspas.", true); }
  const arr = Array.isArray(d) ? d : (d.cartas || d.cards || d.data);
  if (!Array.isArray(arr) || !arr.length) return alertMsg("Não encontrei uma lista de cartas. Use um array ou uma chave “cartas”.", true);
  const ids = new Set(), urls = new Set(), out = [], errs = [];
  arr.forEach((c, k) => {
    const id = Number(c.id);
    const texto = c.texto_original_pdf ?? c.texto;
    if (!Number.isInteger(id) || id < 1) return errs.push(`item ${k+1}: id inválido`);
    if (ids.has(id)) return errs.push(`id ${id} repetido`);
    if (!texto || typeof texto !== "string") return errs.push(`id ${id}: sem texto`);
    const url = c.url_qr_original ?? c.url_qr ?? c.url ?? "";
    if (url && urls.has(url)) errs.push(`id ${id}: link de QR repetido`);
    ids.add(id); if (url) urls.add(url);
    out.push({
      ...c, id,
      texto_original_pdf: texto.slice(0, 600),
      categoria_original_pdf: c.categoria_original_pdf ?? c.categoria ?? "",
      candidato_atribuido_no_pdf: c.candidato_atribuido_no_pdf ?? c.candidato ?? "",
      url_qr_original: url,
      status_verificacao: c.status_verificacao || "pendente",
      publicavel: c.publicavel === true
    });
  });
  if (!out.length) return alertMsg("Nenhuma carta válida. " + errs.slice(0,3).join("; "), true);
  cards = out; save(); render();
  alertMsg(`${out.length} cartas importadas · ${out.filter(isVerified).length} verificadas.` + (errs.length ? ` Avisos: ${errs.slice(0,3).join("; ")}.` : "") + (out.length !== 32 ? " Atenção: o baralho original tem 32 cartas." : ""), !!errs.length);
}
function alertMsg(t, bad){ const m = document.getElementById("impmsg"); if (m) { m.textContent = t; m.className = "msg " + (bad ? "err" : "ok"); } say(t); }

render();
})();
</script>

</body></html>
